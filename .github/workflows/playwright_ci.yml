name: Playwright UI Automation Tests

on:
  push:
    branches: [ master, main, "feature/**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        cache: 'pip' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-playwright python-dotenv

  
    - name: Install Playwright Browsers
      run: playwright install chromium --with-deps


    - name: Run Pytest Automation
      env:
        EBAY_URL: ${{ vars.EBAY_URL }}
        EBAY_USERNAME: ${{ vars.EBAY_USERNAME }}
        EBAY_PASSWORD: ${{ secrets.EBAY_PASSWORD }}

      run: |
        pytest -v -s -rP tests/test_e2e_flow.py


    - name: Upload Test Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots
        path: screenshots/
        if-no-files-found: ignore